name: Release

# Publish prerelease on merge to master (auto-tag from package.json), or on manual v* tags.
# Note: a tag pushed with GITHUB_TOKEN does not start a new workflow — publish runs in this same run.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag (auto on master, verify on tag push)
        id: meta
        run: |
          set -euo pipefail
          git fetch origin master

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
              echo "Tagged commit ${GITHUB_SHA} is not on origin/master."
              echo "Merge into master before tagging a release."
              exit 1
            fi
            echo "Manual tag ${TAG} is on master — will publish."
            echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Move tag to this master commit so republishes with the same version
          # ship the merged code (prerelease / RC workflow).
          git tag -f -a "${TAG}" "${GITHUB_SHA}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}" --force
          echo "Tag ${TAG} points at ${GITHUB_SHA}."

  publish:
    name: Publish (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: publish-linux
          - os: windows-latest
            script: publish-win
          - os: macos-latest
            script: publish-macos
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional signing / notarization secrets (leave unset for unsigned builds).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASSWORD: ${{ secrets.APPLEIDPASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Build the commit that triggered this run (merge commit or tagged SHA).
          ref: ${{ github.sha }}


      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Disable macOS code signing when no certificate is configured
        if: runner.os == 'macOS' && env.CSC_LINK == ''
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Disable Windows code signing when no certificate is configured
        if: runner.os == 'Windows' && env.WIN_CSC_LINK == ''
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
        shell: bash

      - name: Publish application (${{ needs.prepare.outputs.tag }})
        run: npm run ${{ matrix.script }}
