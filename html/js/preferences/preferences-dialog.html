<md-dialog flex="80" class="preferences-dialog">
<form>
    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Preferences</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctl.closeModal()">
                <md-icon md-svg-icon="close"></md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content class="preferences-dialog-content">
        <config-tabs cl-selected="ctl.selectedTabId" class="config-tabs-flush">

            <config-tab cl-id="general" cl-label="General" cl-icon="cog">
                <config-section cl-title="Language" cl-icon="web"></config-section>
                <config-select
                    cl-title="Prefered language"
                    cl-model="ctl.settings.cleep.locale"
                    cl-options="ctl.localeOptions"
                ></config-select>

                <config-section cl-title="Updates" cl-icon="update"></config-section>
                <config-switch
                    cl-title="Auto-update application"
                    cl-model="ctl.settings.cleep.autoupdate"
                ></config-switch>
            </config-tab>

            <config-tab cl-id="network" cl-label="Network" cl-icon="lan">
                <config-note
                    cl-type="note"
                    cl-note="If you experience network issues, the automatically detected network interface may not be the correct one. In that case, select the appropriate interface from the list below."
                ></config-note>
                <config-select
                    cl-title="Interface"
                    cl-model="ctl.selectedNetworkInterface"
                    cl-options="ctl.networkInterfaceOptions"
                    cl-empty="{{ ctl.networkAutomaticLabel }}"
                    cl-disabled="ctl.networkApplying"
                    cl-change="ctl.applyNetworkInterface({value: value})"
                ></config-select>
                <config-comment
                    ng-if="!ctl.networkConfig.activeInterface && ctl.selectedNetworkInterface"
                    cl-comment="'The selected interface has no usable IPv4 address for device discovery.'"
                ></config-comment>
                <config-comment
                    ng-if="ctl.networkApplying"
                    cl-comment="'Restarting message bus...'"
                ></config-comment>
                <config-comment
                    ng-if="!ctl.networkApplying && ctl.networkConfig.busConnected"
                    cl-comment="ctl.networkConfig.peerCount + ' device(s) detected on the message bus.'"
                ></config-comment>
                <config-comment
                    ng-if="!ctl.networkApplying && !ctl.networkConfig.busConnected"
                    cl-comment="'Message bus is not connected.'"
                ></config-comment>

                <config-section cl-title="Cleep website API" cl-icon="web"></config-section>
                <config-note
                    cl-type="info"
                    cl-note="Cleep does not have a public website yet. Access is limited to invited users. To express your interest, please ask on Discord."
                ></config-note>
                <config-button
                    cl-title="Discord"
                    cl-btn-label="Open Discord"
                    cl-btn-icon="discord"
                    cl-btn-style="md-raised"
                    cl-click="ctl.openDiscord()"
                ></config-button>
                <config-text
                    cl-title="API URL"
                    cl-model="ctl.settings.cleep.apiurl"
                    cl-placeholder="https://your-cleep-host/api"
                ></config-text>
                <config-comment
                    cl-comment="'When set, a website sign-in button appears in the left toolbar (under Vault). Leave empty to hide it.'"
                ></config-comment>
            </config-tab>

            <config-tab cl-id="vault" cl-label="Vault" cl-icon="safe">
                <config-note
                    cl-type="note"
                    cl-note="Optional encrypted store used by CleepDesktop to keep application secrets. Disabled by default. Secrets are never shown in this interface."
                ></config-note>

                <config-basic
                    cl-title="'Status'"
                    cl-icon="ctl.vaultStatusIcon"
                >
                    <span>{{ ctl.vaultLockLabel }}</span>
                </config-basic>

                <div ng-if="!ctl.vaultStatus.enabled" layout="column">
                    <config-text cl-title="Passphrase (min. 8 characters)" cl-password="true" cl-model="ctl.vaultForm.passphrase" cl-min="8"></config-text>
                    <config-text cl-title="Confirm passphrase" cl-password="true" cl-model="ctl.vaultForm.passphraseConfirm" cl-min="8"></config-text>
                    <config-button
                        cl-title="Enable vault"
                        cl-btn-label="Enable vault"
                        cl-btn-style="md-raised md-primary"
                        cl-disabled="ctl.vaultBusy"
                        cl-click="ctl.enableVault()"
                    ></config-button>
                </div>

                <div ng-if="ctl.vaultStatus.enabled && !ctl.vaultStatus.unlocked && ctl.vaultPanel === 'main'" layout="column">
                    <config-text
                        cl-title="Unlock vault"
                        cl-placeholder="Passphrase"
                        cl-password="true"
                        cl-model="ctl.vaultForm.passphrase"
                        cl-btn-icon="lock-open-variant"
                        cl-btn-tooltip="Unlock"
                        cl-btn-style="md-raised md-primary"
                        cl-disabled="ctl.vaultBusy"
                        cl-click="ctl.unlockVault()"
                    ></config-text>
                    <config-button
                        cl-title="Forgot passphrase?"
                        cl-subtitle="Recover access with a recovery code"
                        cl-btn-label="Recover"
                        cl-btn-style="md-raised"
                        cl-click="ctl.openVaultRecover()"
                    ></config-button>
                </div>

                <div ng-if="ctl.vaultStatus.enabled && ctl.vaultStatus.unlocked && (ctl.vaultPanel === 'main' || ctl.vaultPanel === 'regen')" layout="column">
                    <config-buttons cl-title="Vault actions" cl-buttons="ctl.vaultMainButtons" cl-limit="4"></config-buttons>
                </div>

                <div ng-if="ctl.vaultPanel === 'change'" layout="column">
                    <config-text cl-title="Current passphrase" cl-password="true" cl-model="ctl.vaultForm.passphrase"></config-text>
                    <config-text cl-title="New passphrase" cl-password="true" cl-model="ctl.vaultForm.nextPassphrase" cl-min="8"></config-text>
                    <config-text cl-title="Confirm new passphrase" cl-password="true" cl-model="ctl.vaultForm.passphraseConfirm" cl-min="8"></config-text>
                    <div layout="row" layout-align="end center">
                        <md-button ng-click="ctl.cancelVaultPanel()">Cancel</md-button>
                        <md-button class="md-raised md-primary" ng-click="ctl.changeVaultPassphrase()" ng-disabled="ctl.vaultBusy">Save passphrase</md-button>
                    </div>
                </div>

                <div ng-if="ctl.vaultPanel === 'disable'" layout="column">
                    <config-note cl-type="error" cl-note="Disabling the vault permanently deletes all stored application secrets."></config-note>
                    <config-text cl-title="Passphrase" cl-password="true" cl-model="ctl.vaultForm.passphrase"></config-text>
                    <div layout="row" layout-align="end center">
                        <md-button ng-click="ctl.cancelVaultPanel()">Cancel</md-button>
                        <md-button class="md-raised md-warn" ng-click="ctl.disableVault()" ng-disabled="ctl.vaultBusy">Disable and wipe</md-button>
                    </div>
                </div>

                <div ng-if="ctl.vaultPanel === 'recover'" layout="column">
                    <config-note cl-type="note" cl-note="Enter one recovery code and choose a new passphrase. The used recovery code is invalidated and a new set is generated."></config-note>
                    <config-text cl-title="Recovery code" cl-model="ctl.vaultForm.recoveryCode"></config-text>
                    <config-text cl-title="New passphrase" cl-password="true" cl-model="ctl.vaultForm.nextPassphrase" cl-min="8"></config-text>
                    <config-text cl-title="Confirm new passphrase" cl-password="true" cl-model="ctl.vaultForm.passphraseConfirm" cl-min="8"></config-text>
                    <div layout="row" layout-align="end center">
                        <md-button ng-click="ctl.cancelVaultPanel()">Cancel</md-button>
                        <md-button class="md-raised md-primary" ng-click="ctl.recoverVault()" ng-disabled="ctl.vaultBusy">Recover vault</md-button>
                    </div>
                </div>

                <div ng-if="ctl.vaultStatus.enabled" layout="column">
                    <config-section cl-title="Recovery codes" cl-icon="key"></config-section>
                    <config-basic cl-title="'Recovery codes'">
                        <span>{{ ctl.vaultRecoveryRemainingLabel }}</span>
                    </config-basic>
                    <config-button
                        cl-title="Regenerate recovery codes"
                        cl-subtitle="Previous codes stop working immediately"
                        cl-btn-label="Regenerate"
                        cl-btn-style="md-raised md-primary"
                        cl-btn-icon="refresh"
                        cl-disabled="!ctl.vaultStatus.unlocked || ctl.vaultBusy || ctl.vaultPanel === 'regen'"
                        cl-click="ctl.openVaultRegen()"
                    ></config-button>
                    <div ng-if="ctl.vaultPanel === 'regen'" layout="column">
                        <config-note cl-type="warning" cl-note="Previous recovery codes will stop working immediately. Enter your passphrase to confirm."></config-note>
                        <config-text
                            cl-title="Confirm passphrase"
                            cl-placeholder="Passphrase"
                            cl-password="true"
                            cl-model="ctl.vaultForm.passphrase"
                            cl-btn-icon="refresh"
                            cl-btn-tooltip="Regenerate"
                            cl-btn-style="md-raised md-primary"
                            cl-disabled="ctl.vaultBusy"
                            cl-click="ctl.regenerateRecoveryCodes()"
                        ></config-text>
                        <div layout="row" layout-align="end center">
                            <md-button ng-click="ctl.cancelVaultPanel()">Cancel</md-button>
                        </div>
                    </div>
                    <div ng-if="ctl.vaultRecoveryCodes.length" layout="column">
                        <config-note cl-type="warning" cl-note="Store these codes in a safe place. They are shown only once."></config-note>
                        <md-input-container class="md-block">
                            <label>Recovery codes</label>
                            <textarea ng-model="ctl.vaultRecoveryCodesText" rows="8" readonly class="vault-unlock-codes"></textarea>
                        </md-input-container>
                        <div layout="row" layout-align="end center">
                            <md-button ng-click="ctl.copyRecoveryCodes()" ng-disabled="ctl.vaultCopyingCodes">
                                <cl-icon cl-icon="content-copy"></cl-icon>
                                Copy
                            </md-button>
                            <md-button class="md-raised md-primary" ng-click="ctl.dismissRecoveryCodes()">I saved these codes</md-button>
                        </div>
                    </div>
                </div>
            </config-tab>

            <config-tab cl-id="cache" cl-label="Cache" cl-icon="folder-open">
                <config-note
                    cl-type="note"
                    cl-note="Downloaded installation images and temporary files used by CleepDesktop. You can remove individual files or clear the whole cache."
                ></config-note>
                <config-button
                    cl-title="Clear cache"
                    cl-btn-label="Clear all"
                    cl-btn-style="md-raised md-primary"
                    cl-btn-icon="delete-sweep"
                    cl-disabled="ctl.cachedFiles.length===0"
                    cl-click="ctl.purgeCachedFiles()"
                ></config-button>
                <config-basic cl-title="'Cache folder'">
                    <span md-truncate>{{ ctl.cacheDir }}</span>
                </config-basic>
                <config-section cl-title="Cached files" cl-icon="file-multiple"></config-section>
                <config-list
                    cl-items="ctl.cachedListItems"
                    cl-empty="No cached files"
                    cl-empty-icon="folder-open"
                ></config-list>
            </config-tab>

            <config-tab cl-id="developer" cl-label="Developer" cl-icon="code-braces">
                <config-note
                    cl-type="note"
                    cl-note="Developer mode lets you develop Cleep applications on a Raspberry Pi from this computer."
                ></config-note>
                <config-switch
                    cl-title="Enable developer mode"
                    cl-model="ctl.settings.cleep.developer"
                ></config-switch>

                <div ng-if="ctl.settings.cleep.developer" layout="column">
                    <config-section cl-title="Development configuration" cl-icon="cog"></config-section>
                    <config-text
                        cl-title="Cleep applications sources folder"
                        cl-subtitle="Choose the parent folder that contains your application sources."
                        cl-model="ctl.settings.cleep.developersources"
                        cl-readonly="true"
                        cl-btn-icon="folder-open"
                        cl-btn-tooltip="Select folder"
                        cl-btn-style="md-raised md-primary"
                        cl-click="ctl.selectDeveloperSourcesFolder()"
                    ></config-text>
                    <config-note
                        ng-if="!ctl.hasDeveloperDevice"
                        cl-type="warning"
                        cl-icon="alert"
                        cl-note="No device has the Developer application installed. Install cleepapp-developer on a Raspberry Pi to use developer mode."
                    ></config-note>
                    <config-select
                        cl-title="Development device"
                        cl-subtitle="Only devices with the Developer application installed can be selected."
                        cl-model="ctl.settings.cleep.developerdevice"
                        cl-options="ctl.developerDeviceOptions"
                        cl-empty="Select a device"
                        cl-disabled="!ctl.hasDeveloperDevice"
                    ></config-select>
                    <config-note
                        ng-if="ctl.settings.cleep.developerdevice && ctl.developerSyncUnsupported"
                        cl-type="warning"
                        cl-note="Source sync over rsync is not supported on Windows yet."
                    ></config-note>
                    <config-text
                        ng-if="ctl.settings.cleep.developerdevice"
                        cl-title="Root SSH password"
                        cl-subtitle="{{ ctl.developerSshSubtitle() }}"
                        cl-password="true"
                        cl-placeholder="password"
                        cl-model="ctl.developerSshPassword"
                        cl-btn-icon="content-save"
                        cl-btn-tooltip="Save SSH password"
                        cl-btn-style="md-raised md-primary"
                        cl-click="ctl.saveDeveloperSshPassword()"
                    ></config-text>

                    <config-section
                        ng-if="ctl.settings.cleep.developersources"
                        cl-title="Applications to synchronize"
                        cl-icon="puzzle"
                    ></config-section>
                    <config-note
                        ng-if="ctl.settings.cleep.developersources && !ctl.developerAppEntries.length"
                        cl-type="info"
                        cl-note="No folders found in the sources directory."
                    ></config-note>
                    <config-note
                        ng-if="ctl.settings.cleep.developersources && ctl.developerAppEntries.length && !ctl.hasValidDeveloperApp"
                        cl-type="warning"
                        cl-note="No Cleep application was detected in this folder. Each app needs a backend Python class inheriting from CleepModule."
                    ></config-note>
                    <div
                        class="developer-apps-list"
                        ng-if="ctl.settings.cleep.developersources && ctl.developerAppEntries.length"
                    >
                        <config-checkbox
                            ng-repeat="app in ctl.developerAppEntries track by app.folderName"
                            cl-title="{{ app.label }}"
                            cl-caption="{{ app.valid ? ('Sync to /root/cleep-dev/modules/' + app.moduleName + '/') : 'Not a Cleep application' }}"
                            cl-front="true"
                            cl-model="ctl.developerAppChecks[app.folderName]"
                            cl-disabled="!app.valid"
                            cl-click="ctl.onDeveloperAppCheck(app, value)"
                        ></config-checkbox>
                    </div>
                </div>
            </config-tab>

            <config-tab cl-id="advanced" cl-label="Advanced" cl-icon="tune">
                <config-section cl-title="Installation images" cl-icon="download"></config-section>
                <config-switch
                    cl-title="Include latest Raspios versions in installer"
                    cl-model="ctl.settings.cleep.isoraspios"
                ></config-switch>
                <config-switch
                    cl-title="Allow local file iso flashing"
                    cl-model="ctl.settings.cleep.isolocal"
                ></config-switch>

                <config-section cl-title="Debug" cl-icon="bug"></config-section>
                <config-switch
                    cl-title="Send CleepDesktop crash report (no personal data). Need app restart"
                    cl-subtitle="This software is open-source and enabling crash report will help us improving the application"
                    cl-model="ctl.settings.cleep.crashreport"
                ></config-switch>
                <config-switch
                    cl-title="Enable debug mode"
                    cl-subtitle="Enabling debug mode add more messages in application log file."
                    cl-model="ctl.settings.cleep.debug"
                ></config-switch>
                <config-button
                    cl-title="Open logs file"
                    cl-btn-label="Open"
                    cl-btn-icon="file"
                    cl-btn-style="md-raised md-primary"
                    cl-click="ctl.openElectronLogs()"
                ></config-button>
            </config-tab>

        </config-tabs>
    </md-dialog-content>
</form>
</md-dialog>
