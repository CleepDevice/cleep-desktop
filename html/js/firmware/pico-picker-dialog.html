<md-dialog flex="40">

    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Pico selection</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctl.closeModal()">
                <md-icon md-svg-icon="close"></md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content style="height: 400px; padding: 8px 16px;">

        <div layout="column" layout-align="center center" layout-fill layout-margin ng-if="!ctl.initialScanDone">
            <md-progress-circular md-mode="indeterminate"></md-progress-circular>
            <span>Looking for Pico boards...</span>
        </div>

        <div ng-if="ctl.initialScanDone">
            <config-note
                ng-if="ctl.showEmptyGuide()"
                cl-type="warning"
                cl-icon="alert"
                cl-note="No Pico found. Plug it normally, or use BOOTSEL as shown below, then refresh."
            ></config-note>

            <div class="pico-bootsel-guide" ng-if="ctl.showEmptyGuide()" role="img" aria-label="Hold BOOTSEL, plug USB, then release BOOTSEL">
                <svg class="pico-bootsel-guide-svg" viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path class="pico-bootsel-cable" d="M8 78 H78" stroke-dasharray="70" stroke-dashoffset="70"></path>
                    <rect class="pico-bootsel-plug" x="78" y="68" width="22" height="20" rx="3"></rect>
                    <rect class="pico-bootsel-board" x="100" y="40" width="150" height="78" rx="8"></rect>
                    <rect class="pico-bootsel-usb-port" x="96" y="70" width="10" height="18" rx="2"></rect>
                    <rect class="pico-bootsel-chip" x="155" y="62" width="36" height="28" rx="3"></rect>
                    <circle class="pico-bootsel-btn" cx="128" cy="78" r="10"></circle>
                    <text x="128" y="116" text-anchor="middle" fill="#546e7a" font-size="10" font-family="Roboto, Helvetica, Arial, sans-serif">BOOTSEL</text>
                    <g class="pico-bootsel-finger">
                        <ellipse cx="128" cy="52" rx="9" ry="14"></ellipse>
                        <rect x="122" y="28" width="12" height="22" rx="6"></rect>
                    </g>
                    <text class="pico-bootsel-hint" x="128" y="28" text-anchor="middle">1. Hold</text>
                    <text class="pico-bootsel-hint pico-bootsel-hint-2" x="40" y="58" text-anchor="middle">2. Plug</text>
                    <g class="pico-bootsel-disk" transform="translate(270 55)">
                        <rect class="pico-bootsel-disk-body" x="0" y="0" width="48" height="40" rx="5"></rect>
                        <text x="24" y="18" text-anchor="middle" fill="#f57f17" font-size="9" font-family="Roboto, Helvetica, Arial, sans-serif">RPI</text>
                        <text x="24" y="30" text-anchor="middle" fill="#f57f17" font-size="9" font-family="Roboto, Helvetica, Arial, sans-serif">RP2</text>
                    </g>
                </svg>
                <p class="pico-bootsel-guide-caption">
                    Hold BOOTSEL, plug USB, then release - or plug normally if the board is already ready.
                </p>
            </div>

            <config-note
                ng-if="ctl.accessHint"
                cl-type="error"
                cl-icon="alert-circle"
                cl-note="{{ ctl.accessHint }}"
            ></config-note>

            <config-button
                ng-repeat="target in ctl.targets track by target.id"
                cl-title="{{ target.title }}"
                cl-subtitle="{{ target.subtitle }}"
                cl-icon="{{ target.kind === 'bootsel' ? 'usb-flash-drive' : 'usb' }}"
                cl-btn-icon="check"
                cl-btn-style="md-raised md-primary"
                cl-disabled="target.accessible === false"
                cl-click="ctl.selectTarget(target)"
            ></config-button>
        </div>

    </md-dialog-content>

    <md-dialog-actions>
        <md-button ng-click="ctl.refresh({ silent: false })" class="md-primary md-raised" ng-disabled="ctl.loading">
            <md-icon md-svg-icon="refresh"></md-icon>
            Refresh list
        </md-button>
    </md-dialog-actions>

</md-dialog>
