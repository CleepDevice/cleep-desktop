<md-dialog flex="50" class="device-details-dialog">

    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>{{::ctl.device.hostname}} informations</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctl.closeModal()">
                <md-icon md-svg-icon="close"></md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content class="device-details-dialog-content">
        <config-tabs cl-selected="ctl.selectedTabId" class="config-tabs-flush">

            <config-tab cl-id="software" cl-label="Software" cl-icon="application">
                <config-basic cl-title="'Device name'">
                    <span>{{ ctl.device.hostname }}</span>
                </config-basic>
                <config-basic cl-title="'Cleep version'">
                    <span>{{ ctl.device.extra.version }}</span>
                </config-basic>

                <config-section cl-title="Installed applications" cl-icon="puzzle"></config-section>
                <div class="device-details-apps" ng-if="ctl.deviceApps.length">
                    <md-chips ng-model="ctl.deviceApps" readonly="true" md-removable="false"></md-chips>
                </div>
                <config-basic ng-if="!ctl.deviceApps.length" cl-title="'No additional applications'"></config-basic>
            </config-tab>

            <config-tab cl-id="security" cl-label="Security" cl-icon="shield-lock">
                <config-basic cl-title="'Authentication'">
                    <md-icon md-svg-icon="{{ ctl.device.auth ? 'check' : 'close' }}"></md-icon>
                </config-basic>
                <config-basic cl-title="'SSL'">
                    <md-icon md-svg-icon="{{ ctl.device.ssl ? 'check' : 'close' }}"></md-icon>
                </config-basic>
            </config-tab>

            <config-tab cl-id="network" cl-label="Network" cl-icon="lan">
                <config-basic cl-title="'Ip address'">
                    <span>{{ ctl.device.ip }}</span>
                </config-basic>
                <config-basic cl-title="'Remote URL'">
                    <span>{{ ctl.remoteUrlLabel }}</span>
                </config-basic>
            </config-tab>

            <config-tab cl-id="hardware" cl-label="Hardware" cl-icon="chip">
                <config-basic cl-title="'Raspberry pi model'">
                    <span>{{ ctl.hardwareModelLabel }}</span>
                </config-basic>
                <config-basic cl-title="'Memory'">
                    <span>{{ ctl.device.extra.hwmemory }}</span>
                </config-basic>
                <config-section cl-title="Board capabilities" cl-icon="memory"></config-section>
                <config-basic cl-title="'Ethernet'">
                    <md-icon md-svg-icon="{{ ctl.device.extra.hwethernet ? 'check' : 'close' }}"></md-icon>
                </config-basic>
                <config-basic cl-title="'Wireless'">
                    <md-icon md-svg-icon="{{ ctl.device.extra.hwwireless ? 'check' : 'close' }}"></md-icon>
                </config-basic>
                <config-basic cl-title="'Audio'">
                    <md-icon md-svg-icon="{{ ctl.device.extra.hwaudio ? 'check' : 'close' }}"></md-icon>
                </config-basic>

                <config-section cl-title="Board" cl-icon="raspberry-pi"></config-section>
                <config-basic cl-title="'Board code'">
                    <span>{{ ctl.device.extra.hwrevision }}</span>
                </config-basic>
                <div class="device-details-board" layout="column" layout-align="center center" ng-if="ctl.boardImg">
                    <img ng-src="{{ ctl.boardImg }}" alt="Board" class="device-details-board-img">
                </div>
            </config-tab>

        </config-tabs>
    </md-dialog-content>

</md-dialog>
