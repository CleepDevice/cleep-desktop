<div>

    <!-- loader -->
    <div ng-if="ctl.loading" style="width:100%; height:80%;">
        <div md-colors="::{ background: 'primary-500' }" class="toolbar-content" layout="row" layout-align="start center">
            <div class="toolbar-spacer"></div>
            <div layout="row" layout-align="left center">
                <h1 class="md-title">Connecting to {{ ctl.hostname }}...</h1>
            </div>
            <md-progress-linear md-mode="indeterminate"></md-progress-linear>
        </div>


        <md-content layout-padding>
            <div layout="column" layout-sm="column" layout-align="center center" layout-fill>
                <div>
                    <md-progress-circular md-mode="indeterminate"></md-progress-circular>   
                </div>
            </div>
        </md-content>
    </div>

    <!-- device content -->
    <div ng-show="!ctl.loading" layout-fill>
        <webview disablewebsecurity allowpopups id="deviceWebview" src="" style="height:100%; width:100%;"></webview>
    </div>

</div>
