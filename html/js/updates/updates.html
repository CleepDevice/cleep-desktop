<div layout="column" layout-fill class="app-page">

    <md-content flex class="app-page-content">
        <div class="app-page-lead" layout="row" layout-align="start center">
            <div class="app-page-lead-badge" layout="row" layout-align="center center" aria-hidden="true">
                <md-icon md-svg-icon="update"></md-icon>
            </div>
            <div flex layout="column">
                <div class="app-page-lead-title">Keep CleepDesktop up to date</div>
                <p class="app-page-lead-text">
                    Check for application updates and make sure Raspberry Pi Imager is installed for SD card flashing.
                </p>
            </div>
        </div>

        <div class="app-page-panel">
            <config-button
                ng-if="!ctl.updateService.restartRequired"
                cl-title="Last check for updates made on {{ctl.updateService.lastUpdateCheck | hrDatetime}}"
                cl-btn-label="Check updates"
                cl-btn-icon="refresh"
                cl-btn-style="md-raised md-primary"
                cl-disabled="ctl.loading"
                cl-click="ctl.checkForUpdates()"
            ></config-button>
            <config-button
                ng-if="ctl.updateService.restartRequired"
                cl-title="Last check for updates made on {{ctl.updateService.lastUpdateCheck | hrDatetime}}"
                cl-subtitle="Please restart CleepDesktop to install latest update"
                cl-btn-label="Restart"
                cl-btn-icon="restart"
                cl-btn-style="md-raised md-accent"
                cl-click="ctl.restartApplication()"
            ></config-button>

            <config-button
                cl-title="CleepDesktop v{{ ctl.updateService.softwareVersions.cleepDesktop }} is installed"
                cl-subtitle="{{ ctl.updateService.cleepDesktopUpdate.error ? ('Error: ' + ctl.updateService.cleepDesktopUpdate.error) : (ctl.updateService.cleepDesktopUpdate.message || '') }}"
                cl-btn-label="Changelog"
                cl-btn-icon="notebook"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openChangelog()"
            ></config-button>
            <config-progress
                ng-if="ctl.updateService.cleepDesktopUpdate.percent>=0 && !ctl.updateService.cleepDesktopUpdate.error"
                cl-title="Downloading CleepDesktop update"
                cl-model="ctl.updateService.cleepDesktopUpdate.percent"
                cl-infinite="ctl.updateService.cleepDesktopUpdate.percent===0"
            ></config-progress>

            <config-basic
                cl-title="ctl.updateService.softwareVersions.flashTool ? ('Raspberry Pi Imager v' + ctl.updateService.softwareVersions.flashTool + ' is installed') : 'Raspberry Pi Imager is not installed. Click on &quot;Check updates&quot; button to install.'"
                cl-subtitle="ctl.updateService.flashToolUpdate.error ? ('Error: ' + ctl.updateService.flashToolUpdate.error) : (ctl.updateService.flashToolUpdate.message || '')"
            ></config-basic>
            <config-progress
                ng-if="ctl.updateService.flashToolUpdate.percent>=0 && !ctl.updateService.flashToolUpdate.error"
                cl-title="Downloading Raspberry Pi Imager"
                cl-model="ctl.updateService.flashToolUpdate.percent"
                cl-infinite="ctl.updateService.flashToolUpdate.percent===0"
            ></config-progress>
        </div>
    </md-content>

</div>
