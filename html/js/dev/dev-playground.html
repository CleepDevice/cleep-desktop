<div layout="column" layout-fill class="app-page">

    <div md-colors="::{ background: 'primary-500' }" class="toolbar-content" layout="row" layout-align="start center">
        <div class="toolbar-spacer"></div>
        <div layout="row" layout-align="left center">
            <md-icon style="color:white;" md-svg-icon="flask"></md-icon>
            <h1 style="padding-left:5px;" class="md-title">Dev playground</h1>
        </div>
    </div>

    <md-content flex class="app-page-content">
        <div class="app-page-lead" layout="row" layout-align="start center">
            <div class="app-page-lead-badge" layout="row" layout-align="center center" aria-hidden="true">
                <md-icon md-svg-icon="flask"></md-icon>
            </div>
            <div flex layout="column">
                <div class="app-page-lead-title">Toolbar task sandbox</div>
                <p class="app-page-lead-text">
                    Trigger fake background tasks to exercise the left-nav indicator (dev builds only).
                </p>
            </div>
        </div>

        <div class="app-page-panel">
            <config-section cl-title="Simulated task" cl-icon="progress-wrench"></config-section>

            <config-progress
                cl-title="{{ ctl.progressTitle }}"
                cl-model="ctl.percent"
                cl-infinite="ctl.infinite"
            ></config-progress>

            <config-note
                ng-if="ctl.note"
                cl-type="{{ ctl.noteType }}"
                cl-note="{{ ctl.note }}"
            ></config-note>

            <config-buttons
                cl-title="Triggers"
                cl-buttons="ctl.triggerButtons"
                cl-limit="4"
            ></config-buttons>
        </div>
    </md-content>

</div>
