<div layout="column" layout-fill class="app-page">

    <md-content flex class="app-page-content">
        <div class="app-page-lead" layout="row" layout-align="start center">
            <div class="app-page-lead-badge" layout="row" layout-align="center center" aria-hidden="true">
                <md-icon md-svg-icon="sd"></md-icon>
            </div>
            <div flex layout="column">
                <div class="app-page-lead-title">Flash Cleep onto an SD card</div>
                <p class="app-page-lead-text">
                    Pick an image, choose a drive, optionally set Wi-Fi, then follow the progress below.
                </p>
            </div>
        </div>

        <div class="app-page-panel">
            <config-section cl-title="Preparation" cl-icon="wrench"></config-section>

            <config-button
                cl-title="{{ !ctl.installService.settings.isoraspios ? 'Select CleepOs version you want to install on your SD card' : 'Select distribution you want to install on your SD card' }}"
                cl-subtitle="{{ ctl.installService.installConfig.iso ? ctl.installService.installConfig.iso.filename : 'No version selected' }}"
                cl-btn-icon="feature-search-outline"
                cl-btn-style="md-raised md-primary"
                cl-disabled="ctl.installService.installing"
                cl-click="ctl.openIsoDialog()"
            ></config-button>

            <config-button
                cl-title="Plug your SD card or your USB card reader on your computer and select it from drives list"
                cl-subtitle="{{ ctl.installService.installConfig.drive ? ctl.installService.installConfig.drive.description : 'No drive selected' }}"
                cl-btn-icon="feature-search-outline"
                cl-btn-style="md-raised md-primary"
                cl-disabled="ctl.installService.installing"
                cl-click="ctl.openDriveDialog()"
            ></config-button>

            <config-select
                ng-if="ctl.installService.installConfig.iso.category==='cleepos'"
                cl-title="Choose way your device will connect to your network"
                cl-model="ctl.installService.installConfig.network"
                cl-options="ctl.networkOptions"
                cl-disabled="ctl.installService.installing"
                cl-change="ctl.onNetworkTypeChange()"
            ></config-select>

            <config-button
                ng-if="(ctl.installService.installConfig.network===1 || ctl.installService.installConfig.network===2) && ctl.installService.installConfig.iso.category=='cleepos'"
                cl-title="Wifi configuration"
                cl-subtitle="{{ ctl.installService.installConfig.wifi ? ctl.installService.installConfig.wifi.network : 'Wifi not configured' }}"
                cl-btn-icon="feature-search-outline"
                cl-btn-style="md-raised md-primary"
                cl-disabled="ctl.installService.installing"
                cl-click="ctl.openWifiDialog()"
            ></config-button>

            <config-button
                cl-title="Click on button to install Cleep and follow install process below"
                cl-subtitle="{{ (!ctl.updateService.softwareVersions.flashTool && !ctl.installService.flashToolInstalled) ? 'Flash tool is not installed yet. Please wait until application updates finish.' : '' }}"
                cl-btn-label="Install"
                cl-btn-icon="sd"
                cl-btn-style="md-raised md-accent"
                cl-disabled="ctl.installService.installing || (!ctl.updateService.softwareVersions.flashTool && !ctl.installService.flashToolInstalled)"
                cl-click="ctl.startInstall()"
            ></config-button>

            <config-section cl-title="Installation progress" cl-icon="flag"></config-section>
            <config-progress
                cl-title="{{ ctl.installProgressTitle }}"
                cl-model="ctl.installService.installProgress.percent"
                cl-show-percent="true"
                cl-btn-icon="cancel"
                cl-btn-tooltip="{{ ctl.installService.canCancelInstall() ? 'Cancel download' : 'Cancel is disabled once the SD card write has started' }}"
                cl-btn-disabled="!ctl.installService.canCancelInstall()"
                cl-cancel="ctl.cancelInstall()"
            ></config-progress>
            <config-note
                ng-if="ctl.installService.installProgress.error.length > 0"
                cl-type="error"
                cl-icon="alert-circle"
                cl-note="{{ 'Installation failed: ' + ctl.installService.installProgress.error }}"
            ></config-note>
            <config-note
                ng-if="ctl.installService.installProgress.terminated && !ctl.installService.installProgress.error.length && ctl.installService.installProgress.step !== 'canceled'"
                cl-type="success"
                cl-icon="check-circle"
                cl-note="Installation completed. Insert the SD card into your Raspberry Pi and power it up."
            ></config-note>

            <config-section cl-title="Having trouble?" cl-icon="bug"></config-section>
            <config-button
                cl-title="If an error occured, you can try to install CleepOs manually"
                cl-btn-label="Manual install tutorial"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.gotoManualInstall()"
            ></config-button>

            <div class="install-powered" layout="row" layout-align="center center">
                <img
                    class="install-powered-logo"
                    src="images/raspberry-pi-logo.png"
                    width="18"
                    height="18"
                    alt=""
                >
                <span class="install-powered-text">Powered by Raspberry Pi Imager</span>
            </div>
        </div>
    </md-content>

</div>
