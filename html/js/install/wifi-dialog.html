<md-dialog flex="50">

    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Wifi configuration</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctl.closeModal()">
                <md-icon md-svg-icon="close"></md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content style="height:350px; padding: 8px 16px;">
        <config-note
            ng-if="!ctl.installService.wifiInfo.hasWifi"
            cl-type="warning"
            cl-icon="alert"
            cl-note="No wifi adapter detected. You can still fill wifi parameters manually."
        ></config-note>

        <config-note
            ng-if="ctl.installService.wifiInfo.hasWifi && ctl.network === 1 && ctl.installService.wifiInfo.retrieved && ctl.installService.wifiInfo.networks.length === 0"
            cl-type="warning"
            cl-icon="alert"
            cl-note="No wifi network found nearby. Enter SSID and password manually."
        ></config-note>

        <config-select
            ng-if="ctl.useNetworkSelector()"
            cl-title="Wifi network"
            cl-model="ctl.selectedWifiSsid"
            cl-options="ctl.wifiNetworkOptions"
            cl-empty="None"
            cl-change="ctl.onWifiNetworkChange()"
        ></config-select>

        <config-text
            ng-if="ctl.useManualWifiFields()"
            cl-title="Wifi network name"
            cl-model="ctl.wifiNetworkName"
        ></config-text>

        <config-select
            ng-if="ctl.useManualWifiFields()"
            cl-title="Network security"
            cl-model="ctl.wifiNetworkSecurity"
            cl-options="ctl.securityOptions"
        ></config-select>

        <config-text
            cl-title="Password"
            cl-password="true"
            cl-model="ctl.wifiPassword"
            cl-disabled="ctl.isUnsecured()"
        ></config-text>
    </md-dialog-content>

    <md-dialog-actions>
        <md-button ng-click="ctl.selectNetwork()" class="md-primary md-raised" ng-disabled="ctl.disableSaveButton()">
            <md-icon md-svg-icon="check"></md-icon>
            Ok
        </md-button>
    </md-dialog-actions>

</md-dialog>
