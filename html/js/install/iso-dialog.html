<md-dialog flex="40">

    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Version selection</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctl.closeModal()">
                <md-icon md-svg-icon="close"></md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content style="height: 450px; padding: 8px 16px;">

        <div layout="column" layout-align="center center" layout-fill layout-margin ng-if="ctl.loading">
            <md-progress-circular md-mode="indeterminate"></md-progress-circular>
            <span>Fetching available versions...</span>
        </div>

        <div ng-show="!ctl.loading">
            <config-section cl-title="Cleep versions" cl-icon="sd"></config-section>
            <config-note
                ng-if="!ctl.installService.isosInfo.cleepos.label"
                cl-type="warning"
                cl-icon="alert-outline"
                cl-note="No Cleep version found. You surely reach free Github api requests amount. Please retry next hour."
            ></config-note>
            <config-button
                ng-if="ctl.installService.isosInfo.cleepos.label"
                cl-title="{{ctl.installService.isosInfo.cleepos.label}} - {{ctl.installService.isosInfo.cleepos.date | date:'yyyy/MM/dd'}} - {{ctl.installService.isosInfo.cleepos.size | hrBytes}}"
                cl-btn-icon="check"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.selectRemoteIso(ctl.installService.isosInfo.cleepos)"
            ></config-button>

            <div ng-if="ctl.installService.settings.isoraspios">
                <config-section cl-title="Latest Raspios" cl-icon="raspberry-pi"></config-section>
                <config-button
                    ng-if="ctl.installService.isosInfo.raspios.full"
                    cl-title="{{ctl.installService.isosInfo.raspios.full.label}} - {{ctl.installService.isosInfo.raspios.full.date | date:'yyyy/MM/dd'}}"
                    cl-btn-icon="check"
                    cl-btn-style="md-raised md-primary"
                    cl-click="ctl.selectRemoteIso(ctl.installService.isosInfo.raspios.full)"
                ></config-button>
                <config-button
                    ng-if="ctl.installService.isosInfo.raspios.lite"
                    cl-title="{{ctl.installService.isosInfo.raspios.lite.label}} - {{ctl.installService.isosInfo.raspios.lite.date | date:'yyyy/MM/dd'}}"
                    cl-btn-icon="check"
                    cl-btn-style="md-raised md-primary"
                    cl-click="ctl.selectRemoteIso(ctl.installService.isosInfo.raspios.lite)"
                ></config-button>
            </div>

            <div ng-if="ctl.installService.settings.isolocal">
                <config-section cl-title="Local iso" cl-icon="folder-open"></config-section>
                <config-button
                    cl-title="Select iso file from your computer"
                    cl-btn-icon="folder-open"
                    cl-btn-style="md-raised md-primary"
                    cl-click="ctl.selectLocalIso()"
                ></config-button>
            </div>
        </div>
    </md-dialog-content>

    <md-dialog-actions>
        <md-button ng-click="ctl.refreshIsos(true)" class="md-primary md-raised" ng-disabled="ctl.loading">
            <md-icon md-svg-icon="refresh"></md-icon>
            Refresh versions
        </md-button>
    </md-dialog-actions>

</md-dialog>
