<md-dialog flex="40">

    <md-toolbar>
        <div class="md-toolbar-tools">
            <h2>Drive selection</h2>
            <span flex></span>
            <md-button class="md-icon-button" ng-click="ctl.closeModal()">
                <md-icon md-svg-icon="close"></md-icon>
            </md-button>
        </div>
    </md-toolbar>

    <md-dialog-content style="height: 400px; padding: 8px 16px;">

        <div layout="column" layout-align="center center" layout-fill layout-margin ng-if="ctl.loading">
            <md-progress-circular md-mode="indeterminate"></md-progress-circular>
            <span>Fetching drive list...</span>
        </div>

        <div ng-show="!ctl.loading">
            <config-note
                ng-if="ctl.installService.drives.length === 0 && !ctl.installService.flashToolInstalled"
                cl-type="warning"
                cl-icon="alert"
                cl-note="Flash tool is not installed. Please go to updates page to install it."
            ></config-note>
            <config-button
                ng-if="ctl.installService.drives.length === 0 && !ctl.installService.flashToolInstalled"
                cl-title="Open updates page"
                cl-btn-label="Open updates page"
                cl-btn-icon="open-in-app"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.gotoUpdates()"
            ></config-button>

            <config-note
                ng-if="ctl.installService.drives.length === 0 && ctl.installService.flashToolInstalled"
                cl-type="warning"
                cl-icon="alert"
                cl-note="No drive found. Please plug SD card or SD card reader then click on refresh button."
            ></config-note>

            <config-button
                ng-repeat="drive in ctl.installService.drives"
                cl-title="{{ drive.description | limitTo: 50 }}"
                cl-subtitle="Size {{ drive.size | hrBytes }}{{ drive.size < ctl.minSize ? ' - >4Go drive required' : '' }}"
                cl-icon="usb-flash-drive"
                cl-btn-icon="check"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.selectDrive(drive)"
            ></config-button>
        </div>

    </md-dialog-content>

    <md-dialog-actions>
        <md-button ng-click="ctl.refreshDrives()" class="md-primary md-raised" ng-disabled="ctl.loading">
            <md-icon md-svg-icon="refresh"></md-icon>
            Refresh drive list
        </md-button>
    </md-dialog-actions>

</md-dialog>
