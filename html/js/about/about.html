<div layout="column" layout-fill class="app-page">

    <div md-colors="::{ background: 'primary-500' }" class="toolbar-content" layout="row" layout-align="start center">
        <div class="toolbar-spacer"></div>
        <div layout="row" layout-align="left center">
            <md-icon style="color:white;" md-svg-icon="information-outline"></md-icon>
            <h1 style="padding-left:5px;" class="md-title">About CleepDesktop</h1>
        </div>
    </div>

    <md-content flex class="app-page-content">
        <div class="app-page-lead" layout="row" layout-align="start center">
            <div class="app-page-lead-badge" layout="row" layout-align="center center" aria-hidden="true">
                <md-icon md-svg-icon="information-outline"></md-icon>
            </div>
            <div flex layout="column">
                <div class="app-page-lead-title">About this application</div>
                <p class="app-page-lead-text">
                    Open-source software to install, discover and configure your Cleep devices.
                </p>
            </div>
        </div>

        <div class="app-page-panel">
            <config-section cl-title="Licenses" cl-icon="copyright"></config-section>
            <config-button
                cl-title="CleepDesktop is open-source software"
                cl-btn-label="MIT License"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://raw.githubusercontent.com/CleepDevice/cleep-desktop/refs/heads/master/LICENSE.txt')"
            ></config-button>
            <config-button
                cl-title="Cleep is developed with Python language"
                cl-btn-label="PSF License"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://docs.python.org/3/license.html')"
            ></config-button>
            <config-button
                cl-title="CleepDesktop frontend is powered by Electron (GitHub)"
                cl-btn-label="MIT license"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://raw.githubusercontent.com/electron/electron/refs/heads/main/LICENSE')"
            ></config-button>
            <config-button
                cl-title="CleepDesktop interface is built with AngularJS"
                cl-btn-label="MIT license"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://raw.githubusercontent.com/angular/angular.js/master/LICENSE')"
            ></config-button>
            <config-button
                cl-title="CleepDesktop interface uses AngularJS Material"
                cl-btn-label="MIT license"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://material.angularjs.org/latest/license')"
            ></config-button>
            <config-button
                cl-title="SD card flashing is powered by Raspberry Pi Imager"
                cl-btn-label="Apache 2.0"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://github.com/raspberrypi/rpi-imager/blob/main/license.txt')"
            ></config-button>
            <config-button
                cl-title="Communications between devices are powered by 0MQ"
                cl-btn-label="LGPLv3"
                cl-btn-style="md-raised md-primary"
                cl-click="ctl.openUrl('https://zeromq.org/license/')"
            ></config-button>

            <div class="about-trademark" layout="row" layout-align="center center">
                <img
                    class="about-trademark-logo"
                    src="images/raspberry-pi-logo.png"
                    width="16"
                    height="16"
                    alt=""
                >
                <span class="about-trademark-text">
                    Raspberry Pi is a trademark of Raspberry Pi Ltd
                </span>
            </div>
        </div>
    </md-content>

</div>
