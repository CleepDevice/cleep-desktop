<div layout="column" layout-fill class="device-error-page">

    <md-content flex class="device-error-content" layout="column" layout-align="center center">
        <div class="device-error-card" layout="column">
            <div class="device-error-art">
                <img ng-src="images/device-error.png" alt="Connection failed" class="device-error-img">
            </div>

            <div class="device-error-body" layout="column" layout-align="center center">
                <div class="device-error-title">
                    Unable to connect to "{{ ctl.hostname }}" device
                </div>
                <p class="device-error-hint">
                    Check that the device is powered on and reachable on the network.
                </p>

                <md-button
                    class="md-raised md-primary device-error-action"
                    ng-if="ctl.deviceUuid"
                    ng-click="ctl.retryConnection()"
                >
                    <md-icon md-svg-icon="reload"></md-icon>
                    Retry
                </md-button>
                <md-button
                    class="md-raised device-error-action"
                    ng-if="ctl.deviceUuid"
                    ng-click="ctl.refreshRemoteUrl()"
                    ng-disabled="!ctl.canRefresh() || ctl.refreshing"
                >
                    <md-icon md-svg-icon="refresh"></md-icon>
                    {{ ctl.refreshing ? 'Refreshing...' : 'Refresh remote URL' }}
                </md-button>
            </div>
        </div>
    </md-content>

</div>
