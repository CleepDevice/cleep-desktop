<div>

    <div style="width:100%; height:80%;">
        <div md-colors="::{ background: 'primary-500' }" class="toolbar-content" layout="row" layout-align="start center">
            <div class="toolbar-spacer"></div>
            <div layout="row" layout-align="left center">
                <h1 class="md-title">Unable to connect to {{ ctl.hostname }}</h1>
            </div>
        </div>

        <md-content layout-padding>
            <div layout="column" layout-sm="column" layout-align="center center" layout-fill>
                <md-card>
                    <img ng-src="images/device-error.png" class="md-card-image">
                </md-card>
                <md-button
                    class="md-raised md-primary"
                    ng-if="ctl.deviceUuid"
                    ng-click="ctl.refreshRemoteUrl()"
                    ng-disabled="!ctl.canRefresh() || ctl.refreshing"
                >
                    <md-icon md-svg-icon="refresh"></md-icon>
                    Refresh remote URL
                </md-button>
            </div>
        </md-content>
    </div>

</div>
