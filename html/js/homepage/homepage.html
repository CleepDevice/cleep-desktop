
<div layout="column" layout-fill class="app-page" ng-controller="homepageController as ctl">

    <md-content flex class="app-page-content">
        <div class="app-page-panel">
            <config-section cl-title="News" cl-icon="bullhorn"></config-section>
            <config-note
                ng-if="ctl.newsService.error && !ctl.loading"
                cl-type="warning"
                cl-note="News feed is unavailable right now. Check your network or try again later."
            ></config-note>
            <config-note
                ng-if="!ctl.loading && !ctl.newsService.error && ctl.newsService.articles.length === 0"
                cl-type="info"
                cl-note="No news yet."
            ></config-note>

            <div class="news-cards" layout="column">
                <div
                    class="news-card"
                    ng-repeat="article in ctl.newsService.articles track by article.slug"
                >
                    <div class="news-card-inner" layout="row">
                        <div class="news-card-cover" ng-if="article.coverUrl">
                            <img ng-src="{{ article.coverUrl }}" alt="" />
                        </div>
                        <div class="news-card-body" layout="column" flex>
                            <div class="news-card-header" layout="row" layout-align="start baseline">
                                <div class="news-card-title" flex>{{ article.title }}</div>
                                <div class="news-card-meta" ng-if="article.publishedAt">
                                    {{ article.publishedAt / 1000 | hrDatetime }}
                                </div>
                            </div>
                            <div class="news-card-content" ng-bind-html="article.bodyHtml"></div>
                        </div>
                    </div>
                </div>
            </div>

            <config-section cl-title="Latest tutorials" cl-icon="video"></config-section>
            <config-note cl-type="info" cl-note="Coming soon..."></config-note>
        </div>
    </md-content>

</div>
